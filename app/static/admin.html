<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SilverCare — пульт</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="icon" href="/static/logo.png">
  <style>
    :root {
      --pico-primary: #2563eb; --pico-primary-hover: #1d4ed8; --pico-primary-background: #2563eb;
      --pico-font-size: 87.5%; --pico-spacing: 0.75rem;
    }
    main.container { max-width: 1000px; }
    table td, table th { white-space: nowrap; }
    table td.wide, table th.wide { white-space: normal; width: 100%; }
    .badge { color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 0.85em; white-space: nowrap; }
    .badge-taken { background: #16a34a; }
    .badge-missed { background: #dc2626; }
    .badge-pending { background: #6b7280; }
    button.sm { padding: 0.2rem 0.6rem; font-size: 0.85em; margin: 0; width: auto; }
    .muted { color: var(--pico-muted-color); }
    .err { color: var(--pico-del-color); }
    .missed-box { border-left: 6px solid #dc2626; }
    .missed-box ul { margin-bottom: 0; }
  </style>
</head>
<body>
<main class="container">
  <header style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;">
    <div style="display:flex; align-items:center; gap:1rem;">
      <img src="/static/logo.png" alt="SilverCare" width="56" height="56" style="border-radius:12px; flex:none;">
      <hgroup style="margin:0;">
        <h1>SilverCare</h1>
        <p>Пульт родственника</p>
      </hgroup>
    </div>
    <div style="display:flex; align-items:center; gap:0.75rem; flex:none;">
      <small id="busy" class="muted" hidden>Обновляется…</small>
      <button type="button" id="refresh" class="secondary outline">Обновить</button>
    </div>
  </header>
  <div id="view"></div>
  <p><small id="updated" class="muted"></small></p>
</main>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const STATUS_RU = { taken: 'принято', missed: 'пропущено', pending: 'ожидает' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = iso => iso ? iso.slice(11, 16) : '';
const badge = st => `<span class="badge badge-${esc(st)}">${esc(STATUS_RU[st] || st)}</span>`;
const nextText = t => (t && t.next) ? `${hhmm(t.next.scheduled_at)} ${esc(t.next.medication_name)}` : '—';

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(errorText(res.status, data));
  return data;
}
function errorText(status, data) {
  if (!data || !data.detail) return `Ошибка ${status}`;
  if (typeof data.detail === 'string') return `${status}: ${data.detail}`;
  if (Array.isArray(data.detail)) {
    return `${status}: ` + data.detail.map(e => `${(e.loc || []).slice(-1)[0]}: ${e.msg}`).join('; ');
  }
  return `Ошибка ${status}`;
}

// ---------- busy indicator ----------
// While any request is in flight: clicked button gets aria-busy + disabled,
// every other action button is disabled, header shows "Обновляется…".
let busyBtn = null;
function setBusy(on, btn) {
  $('#busy').hidden = !on;
  if (on) {
    busyBtn = btn || null;
    if (busyBtn) busyBtn.setAttribute('aria-busy', 'true');
  } else if (busyBtn) {
    busyBtn.removeAttribute('aria-busy');
    busyBtn = null;
  }
  $$('#view button, #refresh').forEach(b => { b.disabled = on; });
}

// ---------- routing ----------
function route() {
  const m = location.hash.match(/^#\/patient\/(\d+)$/);
  return m ? { name: 'patient', id: Number(m[1]) } : { name: 'list' };
}

// ---------- missed block ----------
// entries: [{time, patient, med, iso}] → <article> with red left border, or '' if none.
function missedBlock(entries) {
  if (!entries.length) return '';
  entries.sort((a, b) => a.iso.localeCompare(b.iso));
  const lis = entries.map(e => `<li>${e.patient ? esc(e.patient) + ' — ' : ''}${esc(e.med)} ${hhmm(e.iso)}</li>`).join('');
  return `<article class="missed-box"><strong>Пропущено сегодня</strong><ul>${lis}</ul></article>`;
}
const missedOf = (today, patientName) => (today ? today.items : [])
  .filter(i => i.status === 'missed')
  .map(i => ({ iso: i.scheduled_at, med: i.medication_name, patient: patientName }));

// ---------- screen 1: patients list ----------
async function renderList() {
  const [stats, patients] = await Promise.all([api('GET', '/stats'), api('GET', '/patients')]);
  const todays = await Promise.all(patients.map(p => api('GET', `/patients/${p.id}/today`).catch(() => null)));

  const missed = patients.flatMap((p, i) => missedOf(todays[i], p.name));
  const rows = patients.map((p, i) => {
    const t = todays[i];
    const cnt = { taken: 0, missed: 0, pending: 0 };
    if (t) t.items.forEach(x => { if (x.status in cnt) cnt[x.status]++; });
    const meds = p.medications.filter(m => m.active).length;
    return `<tr data-id="${p.id}">
      <td class="wide"><a href="#/patient/${p.id}">${esc(p.name)}</a> <small class="muted">id ${p.id}</small></td>
      <td>${meds}</td>
      <td>${t ? `${cnt.taken} / ${cnt.missed} / ${cnt.pending}` : '<span class="muted">—</span>'}</td>
      <td>${nextText(t)}</td>
      <td><button type="button" class="secondary outline sm" data-action="del-patient">Удалить</button></td>
    </tr>`;
  }).join('');

  $('#view').innerHTML = `
    <p>Итого: Принято <strong>${stats.taken}</strong> · Пропущено <strong>${stats.missed}</strong> · Пропуски <strong>${stats.missed_pct} %</strong></p>
    ${missedBlock(missed)}
    <table class="striped">
      <thead><tr><th class="wide">Имя</th><th>Лекарств</th><th>Сегодня: принято / пропущено / ожидает</th><th>Следующий приём</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="muted">Пациентов пока нет</td></tr>'}</tbody>
    </table>
    <small class="err" id="list-err"></small>
    <details>
      <summary>Добавить пациента</summary>
      <form id="add-patient">
        <fieldset role="group">
          <input name="name" placeholder="Имя" required>
          <button type="submit">Добавить</button>
        </fieldset>
        <small class="err"></small>
      </form>
    </details>`;
}

// ---------- screen 2: patient card ----------
async function renderPatient(id) {
  // Only this patient's data: /patients/{id} + /patients/{id}/today.
  const [p, today] = await Promise.all([api('GET', `/patients/${id}`), api('GET', `/patients/${id}/today`)]);

  const meds = p.medications.filter(m => m.active);
  const medRows = meds.length
    ? meds.map(m => `<tr data-med="${m.id}">
        <td class="wide">${esc(m.name)}</td><td>${esc(m.dose)}</td><td>${esc(m.times)}</td>
        <td><button type="button" class="secondary outline sm" data-action="del-med">Убрать</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="muted">Лекарств нет</td></tr>';
  const itemRows = today.items.length
    ? today.items.map(i => `<tr><td>${hhmm(i.scheduled_at)}</td><td class="wide">${esc(i.medication_name)}</td><td>${badge(i.status)}</td></tr>`).join('')
    : '<tr><td colspan="3" class="muted">Слотов на сегодня нет</td></tr>';

  $('#view').innerHTML = `
    <p><a href="#/">← Пациенты</a></p>
    <h2>${esc(p.name)} <small class="muted">id ${p.id}</small></h2>
    <div class="grid" data-id="${p.id}">
      <div>
        <h4>Лекарства</h4>
        <table class="striped">
          <thead><tr><th class="wide">Название</th><th>Доза</th><th>Время</th><th></th></tr></thead>
          <tbody>${medRows}</tbody>
        </table>
        <small class="err" id="med-err"></small>
        <details>
          <summary>Добавить лекарство</summary>
          <form id="add-med">
            <fieldset role="group">
              <input name="name" placeholder="Название" required>
              <input name="dose" placeholder="Доза, напр. 1 таблетка" required>
              <input name="times" placeholder="08:00,20:00" required>
              <button type="submit">Добавить</button>
            </fieldset>
            <small class="err"></small>
          </form>
        </details>
      </div>
      <div>
        <h4>Сегодня</h4>
        ${missedBlock(missedOf(today, null))}
        <table class="striped">
          <thead><tr><th>Время</th><th class="wide">Лекарство</th><th>Статус</th></tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
        <p><small>Следующий: ${nextText(today)}</small></p>
      </div>
    </div>
    <div role="group" style="width:auto">
      <button type="button" class="contrast" data-action="demo-slot">Демо-слот +2 мин</button>
      <button type="button" class="secondary outline" data-action="reset-today">Сбросить сегодня</button>
    </div>
    <small class="err" id="card-err"></small>`;
}

// ---------- load / actions ----------
let loading = false;
// Fetch and render the current screen. The old DOM stays until new data arrives
// (renderers only touch innerHTML at the very end).
async function load(btn) {
  if (loading) return;
  loading = true;
  setBusy(true, btn || $('#refresh'));
  try {
    const r = route();
    if (r.name === 'patient') await renderPatient(r.id); else await renderList();
    $('#updated').textContent = 'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
  } catch (e) {
    $('#view').innerHTML = `<p><a href="#/">← Пациенты</a></p><p class="err">Ошибка загрузки: ${esc(e.message)}</p>`;
  } finally {
    setBusy(false);
    loading = false;
  }
}

// Run an action (fn) with the clicked button busy, then reload the screen.
async function action(btn, errSel, fn) {
  if (loading) return;
  const err = $(errSel);
  if (err) err.textContent = '';
  loading = true;
  setBusy(true, btn);
  let failed = null;
  try {
    await fn();
  } catch (e) {
    failed = e;
  } finally {
    setBusy(false);
    loading = false;
  }
  if (failed) {
    const e2 = $(errSel);
    if (e2) e2.textContent = failed.message;
    return;
  }
  await load(btn);
}

$('#refresh').addEventListener('click', () => load($('#refresh')));
window.addEventListener('hashchange', () => load());

$('#view').addEventListener('submit', ev => {
  const form = ev.target;
  ev.preventDefault();
  const submitBtn = $('button[type="submit"]', form);
  let call;
  if (form.id === 'add-patient') {
    call = () => api('POST', '/patients', { name: form.name.value.trim() });
  } else if (form.id === 'add-med') {
    call = () => api('POST', `/patients/${route().id}/medications`, {
      name: form.name.value.trim(), dose: form.dose.value.trim(), times: form.times.value.trim(),
    });
  } else return;
  const errSel = `#${form.id} .err`;
  action(submitBtn, errSel, async () => { await call(); form.reset(); });
});

$('#view').addEventListener('click', ev => {
  // Delegated: buttons are re-rendered on every load(), so listen on the container.
  // NOTE: button.type is "submit" by default even outside a form, so dispatch on data-action.
  const btn = ev.target.closest('button[data-action]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.action;
  if (act === 'del-patient') {
    const tr = btn.closest('tr'); const id = tr.dataset.id;
    const name = $('a', tr).textContent;
    if (!confirm(`Удалить пациента «${name}» вместе с лекарствами и историей?`)) return;
    action(btn, '#list-err', () => api('DELETE', `/patients/${id}`));
  } else if (act === 'del-med') {
    const mid = btn.closest('tr').dataset.med;
    if (!confirm('Убрать лекарство из активных?')) return;
    action(btn, '#med-err', () => api('DELETE', `/medications/${mid}`));
  } else if (act === 'demo-slot') {
    action(btn, '#card-err', () => api('POST', `/patients/${route().id}/demo-slot?minutes=2`));
  } else if (act === 'reset-today') {
    if (!confirm('Удалить все слоты пациента за сегодня?')) return;
    action(btn, '#card-err', () => api('DELETE', `/patients/${route().id}/today`));
  }
});

load();
setInterval(() => load(), 30000);
</script>
</body>
</html>
